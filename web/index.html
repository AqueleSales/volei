<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Volei da Quadra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F1F5F9;--card:#fff;--tx:#0F172A;--mut:#64748B;--bd:#E2E8F0;--az:#2563EB;--lar:#EA580C;--ok:#16A34A;--bad:#DC2626}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#162033;--tx:#F1F5F9;--mut:#94A3B8;--bd:#263449}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:12px 14px}
h2{margin:18px 0 8px;font-size:1.15rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut);font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font-size:.72rem;font-weight:600}

nav button.on{color:var(--az)}
button,.btn{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--card);
  color:var(--tx);border:1px solid var(--bd);text-align:center;margin-bottom:8px;transition:transform .1s}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--az);color:#fff;border-color:var(--az)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;margin:0 6px 0 0}
.btn[disabled]{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metrics div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.metrics b{display:block;font-size:1.4rem}
.head{border-radius:12px;padding:8px 12px;font-weight:800;color:#fff;margin-bottom:8px}
.head.a{background:linear-gradient(135deg,#2563EB,#38BDF8)}
.head.b{background:linear-gradient(135deg,#EA580C,#FBBF24)}
.linha{display:flex;align-items:center;gap:10px;padding:5px 6px;border:1px solid var(--bd);border-radius:10px;margin-bottom:5px;font-size:.92rem}
.animar .linha,.animar .card,.animar .head{animation:subir .35s ease both}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.tag{font-size:.65rem;background:#F59E0B;color:#000;border-radius:5px;padding:1px 6px}
.nv{margin-left:auto;font-size:.72rem;color:var(--mut)}

.placar.pop{animation:pop .35s ease}
.banner{text-align:center;font-size:1.3rem;font-weight:800;padding:12px;border-radius:14px;color:#fff;
  background:linear-gradient(135deg,#16A34A,#4ADE80);margin:10px 0;animation:pop .5s ease}
.tiro{text-align:center;font-weight:800;padding:10px;border-radius:14px;background:var(--bad);color:#fff;margin:10px 0;animation:pulsar 1s infinite}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-weight:600;transition:all .15s}
.pill.on{background:var(--az);border-color:var(--az);color:#fff;transform:scale(1.04)}
.step{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.4rem;font-weight:700}
.step b{font-size:1.3rem}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input[type=range]{width:100%}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:center}
td:first-child,th:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.modal>div{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;animation:subir .25s ease}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;animation:subir .25s ease}
#confete{position:fixed;inset:0;pointer-events:none;z-index:40}
.foto-prev{width:80px;height:80px;border-radius:50%;object-fit:cover}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.quad{border-radius:22px;color:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:210px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.quad.a{background:linear-gradient(150deg,#1D4ED8,#38BDF8)}
.quad.b{background:linear-gradient(150deg,#C2410C,#FBBF24)}
.qt{font-weight:800;letter-spacing:.08em;font-size:.85rem;opacity:.95}
.placar{font-size:5.2rem;font-weight:900;line-height:1}
.pm{display:flex;gap:8px;width:100%}
.pm button{flex:1;height:50px;border:0;border-radius:14px;font-size:1.8rem;font-weight:800;background:rgba(255,255,255,.25);color:#fff;transition:transform .1s}
.pm button:active{transform:scale(.9)}
.pm .mais{background:#fff;color:#0F172A}
.pm button[disabled]{opacity:.35}
.btn.grande{padding:18px;font-size:1.1rem;border-radius:16px}
.card.time{padding:8px}
.th{border-radius:10px;padding:6px 10px;font-weight:800;color:#fff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.th small{font-weight:600;opacity:.9;font-size:.7rem}
.th.a{background:#2563EB}.th.b{background:#EA580C}
.card.time .linha{padding:4px 5px;font-size:.82rem;gap:7px}
.card.time .av{width:28px!important;height:28px!important;font-size:.8rem}
.card.time .tag,.card.time .nv{display:none}
.card.time .linha span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vazio{text-align:center}.vazio .big svg{width:56px;height:56px;color:var(--az)}
.topo{display:flex;align-items:baseline;justify-content:space-between}
.cont{color:var(--mut)}.cont b{color:var(--ok);font-size:1.5rem}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cel{position:relative;border:2px solid var(--bd);background:var(--card);border-radius:18px;padding:12px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--tx);font-size:.78rem;font-weight:700;min-width:0;transition:all .18s}
.cel span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.cel:active{transform:scale(.94)}
.cel .av{transition:filter .2s}
.cel:not(.on){opacity:.5}.cel:not(.on) .av{filter:grayscale(1)}
.cel.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.grade.neutro .cel:not(.on){opacity:1}.grade.neutro .cel:not(.on) .av{filter:none}
.grade.neutro .cel.on{border-color:var(--az);background:color-mix(in srgb,var(--az) 14%,var(--card))}
.chk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.6,1)}
.chk svg{width:13px;height:13px;stroke-width:3.5}
.grade.neutro .chk{background:var(--az)}
.cel.on .chk{transform:scale(1)}
.seg{display:flex;background:var(--bd);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);transition:all .18s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}
nav button svg{width:24px;height:24px;display:block;margin:0 auto 2px}
.aviso{background:color-mix(in srgb,#F59E0B 18%,var(--card));border:1px solid #F59E0B;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:.85rem}
.vaga{background:color-mix(in srgb,var(--az) 14%,var(--card));border:1px dashed var(--az);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:.8rem;text-align:center}
.cel.cam{border-color:#F59E0B;opacity:.9}.cel.cam .av{filter:none}
.cel .sub{font-size:.62rem;color:#F59E0B;font-weight:700;margin-top:-4px}
.pos{width:22px;text-align:center;color:var(--mut)}
.seg label{flex:1;position:relative}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label span{display:block;text-align:center;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);transition:all .18s;cursor:pointer}
.seg label input:checked+span{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.chip{display:none;margin-left:auto;font-size:.62rem;font-weight:700;color:#fff;border-radius:5px;padding:1px 6px}
.card.time .chip{display:inline-block}
.chip.k,.sub.k{background:#0EA5E9}.chip.p,.sub.p{background:#7C3AED}
.cel .sub.k,.cel .sub.p{color:#fff;border-radius:5px;padding:0 5px;margin-top:-2px}
.nv.k{color:#0EA5E9;font-weight:700}.nv.p{color:#7C3AED;font-weight:700}
.comp{font-size:.72rem;margin:-2px 2px 6px}
.chk.num{font-style:normal;font-size:.72rem;font-weight:800;width:22px;height:22px}
.linha.sel{border-color:var(--az);background:color-mix(in srgb,var(--az) 14%,var(--card))}
.setas{display:flex;gap:6px;margin-left:8px}
.setas button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:0;display:flex;align-items:center;justify-content:center}
.setas button[disabled]{opacity:.3}
.setas svg{width:18px;height:18px}
.barra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:540px;z-index:6;
  background:var(--card);border:1px solid var(--az);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:subir .2s ease}
.barra-b{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.barra-b .btn.sm{margin:0}
.fila .linha{padding:4px 6px}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulsar{50%{opacity:.6}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<canvas id="confete"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
